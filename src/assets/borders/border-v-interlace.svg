<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cenefa vertical — cordón trenzado + nudos triqueta, para márgenes laterales.
  Tile de 48×120, repite sin costura verticalmente:
    background-image: url(border-v-interlace.svg);
    background-repeat: repeat-y;
    background-size: 48px 120px;
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 120" width="48" height="120">
  <defs>
    <path id="vi-triquetra" fill="none"
      d="M0,-12 A20.78,20.78 0 0 1 10.39,6 A20.78,20.78 0 0 1 -10.39,6 A20.78,20.78 0 0 1 0,-12 Z" />
    <g id="vi-dotring">
      <circle cx="17" cy="0" r="1.1" />
      <circle cx="13.03" cy="10.93" r="1.1" />
      <circle cx="2.95" cy="16.74" r="1.1" />
      <circle cx="-8.5" cy="14.72" r="1.1" />
      <circle cx="-15.98" cy="5.82" r="1.1" />
      <circle cx="-15.98" cy="-5.82" r="1.1" />
      <circle cx="-8.5" cy="-14.72" r="1.1" />
      <circle cx="2.95" cy="-16.74" r="1.1" />
      <circle cx="13.03" cy="-10.93" r="1.1" />
    </g>
    <g id="vi-medallion">
      <use href="#vi-dotring" fill="hsl(var(--border-vermillion, 1 46% 43%))" />
      <use href="#vi-triquetra" stroke="hsl(var(--border-lapis, 213 32% 40%))" stroke-width="1.4" />
      <use href="#vi-triquetra" stroke="hsl(var(--border-gold, 46 65% 38%))" stroke-width="1" transform="scale(0.55)" />
    </g>
  </defs>

  <path d="M24,0 C24,15 16,15 16,30 C16,45 24,45 24,60 C24,75 32,75 32,90 C32,105 24,105 24,120"
    fill="none" stroke="hsl(var(--border-gold, 46 65% 38%))" stroke-width="1.2" stroke-linecap="round" />
  <path d="M27,0 C27,15 19,15 19,30 C19,45 27,45 27,60 C27,75 35,75 35,90 C35,105 27,105 27,120"
    fill="none" stroke="hsl(var(--border-lapis, 213 32% 40%))" stroke-width="0.9" stroke-linecap="round" opacity="0.7" />

  <use href="#vi-medallion" transform="translate(16,30)" />
  <use href="#vi-medallion" transform="translate(32,90)" />
</svg>
