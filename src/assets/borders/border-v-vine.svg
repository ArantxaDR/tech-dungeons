<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cenefa vertical — pámpano/zarcillo con hojas y bayas, para márgenes laterales.
  Tile de 40×100, repite sin costura verticalmente:
    background-image: url(border-v-vine.svg);
    background-repeat: repeat-y;
    background-size: 40px 100px;
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100" width="40" height="100">
  <defs>
    <g id="vv-leaf">
      <path d="M0,0 C-4,-5 -4,-12 0,-16 C4,-12 4,-5 0,0 Z" fill="none" />
      <path d="M0,-2 L0,-14" fill="none" />
    </g>
    <g id="vv-berries">
      <circle cx="-2" cy="1" r="0.9" />
      <circle cx="1.5" cy="2.5" r="0.9" />
      <circle cx="0" cy="-1.5" r="0.9" />
    </g>
  </defs>

  <!-- stem -->
  <path d="M20,0 C8,25 32,75 20,100" fill="none"
    stroke="hsl(var(--border-gold, 46 65% 38%))" stroke-width="1.3" stroke-linecap="round" />

  <use href="#vv-leaf" transform="translate(17,23) rotate(-115)"
    stroke="hsl(var(--border-lapis, 213 32% 40%))" stroke-width="0.9" />
  <use href="#vv-berries" transform="translate(17,23)" fill="hsl(var(--border-vermillion, 1 46% 43%))" />

  <use href="#vv-leaf" transform="translate(23,77) rotate(65)"
    stroke="hsl(var(--border-vermillion, 1 46% 43%))" stroke-width="0.9" />
  <use href="#vv-berries" transform="translate(23,77)" fill="hsl(var(--border-gold, 46 65% 38%))" />
</svg>
