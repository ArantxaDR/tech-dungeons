<?xml version="1.0" encoding="UTF-8"?>
<!--
  Filigrana monocroma — nudo triqueta central + 4 zarcillos, solo trazo.
  No es un tile: pieza única pensada como marca de agua de fondo, grande y a
  baja opacidad. En CSS: set color to the border-gold custom property (hsl),
  opacity around 0.1, and a large explicit width/height (e.g. 400px).
  Usa currentColor (un único tono) — es la variante "monocromo" pedida.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
  fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <g id="w-leaf">
      <path d="M0,0 C-5,-7 -5,-16 0,-22 C5,-16 5,-7 0,0 Z" />
      <path d="M0,-3 L0,-19" />
    </g>
    <g id="w-spray">
      <path d="M35,-35 C50,-55 60,-60 75,-78" />
      <use href="#w-leaf" transform="translate(75,-78) rotate(-45) scale(1.3)" />
    </g>
  </defs>

  <g transform="translate(100,100)">
    <!-- central triquetra, radius 60 -->
    <path d="M0,-60 A103.92,103.92 0 0 1 51.96,30 A103.92,103.92 0 0 1 -51.96,30 A103.92,103.92 0 0 1 0,-60 Z" />
    <path d="M0,-33 A57.16,57.16 0 0 1 28.6,16.5 A57.16,57.16 0 0 1 -28.6,16.5 A57.16,57.16 0 0 1 0,-33 Z" stroke-width="0.8" />

    <use href="#w-spray" transform="rotate(0)" />
    <use href="#w-spray" transform="rotate(90)" />
    <use href="#w-spray" transform="rotate(180)" />
    <use href="#w-spray" transform="rotate(270)" />
  </g>
</svg>
