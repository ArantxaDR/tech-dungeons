<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cenefa horizontal — bestiario: pajarillo estilizado alternado con roundel
  de nudo triqueta, estilo marginalia de bestiario monástico.
  Tile de 160×48, repite sin costura:
    background-image: url(border-h-bestiary.svg);
    background-repeat: repeat-x;
    background-size: 160px 48px;
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <g id="b-bird">
      <path d="M-9,2 C-9,-6 4,-9 9,-3 C11,-1 9,2 5,2 C7,4 4,6 0,5 C-4,7 -8,5 -9,2 Z" />
      <path d="M-9,2 C-12,0 -12,-3 -10,-4" fill="none" />
      <path d="M-3,-2 C1,-6 5,-4 7,-1" fill="none" />
      <path d="M9,-3 L14,-2 L9,0 Z" />
      <circle cx="6" cy="-3" r="0.8" fill="hsl(var(--border-parchment, 60 40% 91%))" />
    </g>
    <path id="b-triquetra" fill="none"
      d="M0,-12 A20.78,20.78 0 0 1 10.39,6 A20.78,20.78 0 0 1 -10.39,6 A20.78,20.78 0 0 1 0,-12 Z" />
    <g id="b-dotring">
      <circle cx="17" cy="0" r="1.1" />
      <circle cx="13.03" cy="10.93" r="1.1" />
      <circle cx="2.95" cy="16.74" r="1.1" />
      <circle cx="-8.5" cy="14.72" r="1.1" />
      <circle cx="-15.98" cy="5.82" r="1.1" />
      <circle cx="-15.98" cy="-5.82" r="1.1" />
      <circle cx="-8.5" cy="-14.72" r="1.1" />
      <circle cx="2.95" cy="-16.74" r="1.1" />
      <circle cx="13.03" cy="-10.93" r="1.1" />
    </g>
  </defs>

  <path d="M0,24 C20,24 20,16 40,16 C60,16 60,24 80,24 C100,24 100,32 120,32 C140,32 140,24 160,24"
    fill="none" stroke="hsl(var(--border-gold, 46 65% 38%))" stroke-width="1.2" stroke-linecap="round" />

  <use href="#b-bird" transform="translate(40,20)"
    fill="hsl(var(--border-lapis, 213 32% 40%))" stroke="hsl(var(--border-lapis, 213 32% 40%))" stroke-width="0.9" />

  <g transform="translate(120,24)">
    <use href="#b-dotring" fill="hsl(var(--border-vermillion, 1 46% 43%))" />
    <use href="#b-triquetra" stroke="hsl(var(--border-gold, 46 65% 38%))" stroke-width="1.3" />
    <use href="#b-triquetra" stroke="hsl(var(--border-lapis, 213 32% 40%))" stroke-width="1" transform="scale(0.55)" />
  </g>
</svg>
